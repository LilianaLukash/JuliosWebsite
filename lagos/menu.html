    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --accent: #c38a4b;
        --dark: #1f1b1a;
        --text: #3c3230;
        --muted: #8b7a74;
        --bg: #f8f4ef;
        --max-width: 1100px;
      }

      html,
      body {
        font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      header {
        background: rgba(248, 244, 239, 0.96);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #e1d6c9;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .nav {
        max-width: var(--max-width);
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        gap: 0.75rem;
      }

      .logo {
        font-family: "Playfair Display", serif;
        font-size: 1.7rem;
        letter-spacing: 0.08em;
      }

      .logo span {
        color: var(--accent);
      }

      .back-btn {
        color: var(--muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: color 0.3s;
        white-space: nowrap;
      }

      .back-btn:hover {
        color: var(--accent);
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }

      .lang-switcher,
      .loc-switcher {
        display: inline-flex;
        border: 1px solid #e1d6c9;
        border-radius: 999px;
        overflow: hidden;
        background: white;
      }

      .lang-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        padding: 0.45rem 0.65rem;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .lang-btn.active {
        background: var(--accent);
        color: white;
      }

      .lang-btn:hover:not(.active) {
        color: var(--text);
      }

      .loc-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.45rem 0.7rem;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .loc-btn.active {
        background: var(--dark);
        color: white;
      }

      .loc-btn:hover:not(.active) {
        color: var(--text);
      }

      main {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 3rem 1.5rem;
      }

      .section-header {
        margin-bottom: 2.5rem;
        text-align: center;
      }

      .section-kicker {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--muted);
        margin-bottom: 0.8rem;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }

      .section-lead {
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.6;
        max-width: 600px;
        margin: 0 auto 2rem;
      }

      .menu-content {
        background: white;
        border-radius: 1.2rem;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.08);
        padding: 2.5rem;
      }

      .menu-section {
        margin-bottom: 2.5rem;
      }

      .menu-section:last-child {
        margin-bottom: 0;
      }

      .menu-section h2 {
        font-family: "Playfair Display", serif;
        font-size: 1.5rem;
        color: var(--accent);
        border-bottom: 2px solid var(--accent);
        padding-bottom: 0.8rem;
        margin-bottom: 1.5rem;
        letter-spacing: 0.08em;
      }

      .menu-section-note {
        font-size: 0.88rem;
        color: var(--muted);
        margin-top: -0.5rem;
        margin-bottom: 0.5rem;
        font-style: italic;
      }

      .menu-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2rem;
        align-items: baseline;
        padding: 1rem 0;
        border-bottom: 1px solid #ede6df;
      }

      .menu-item:last-child {
        border-bottom: none;
      }

      .menu-item-name {
        font-family: "Playfair Display", serif;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 0.3rem;
      }

      .menu-item-desc {
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .menu-item-price {
        font-family: "Playfair Display", serif;
        font-size: 1rem;
        color: var(--accent);
        font-weight: 600;
        white-space: nowrap;
      }

      .menu-note {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #ede6df;
        font-size: 0.9rem;
        color: var(--muted);
        text-align: center;
      }

      footer {
        border-top: 1px solid #e1d6c9;
        padding: 1.4rem 1.5rem 1.8rem;
        font-size: 0.8rem;
        color: var(--muted);
        max-width: var(--max-width);
        margin: 3rem auto 0;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      footer a {
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      @media (max-width: 768px) {
        .nav {
          padding: 1rem 1rem;
          flex-wrap: wrap;
        }

        .logo {
          order: -1;
          width: 100%;
          text-align: center;
          margin-bottom: 0.35rem;
        }

        h1 {
          font-size: 1.5rem;
        }

        main {
          padding: 1.5rem 1rem;
        }

        .menu-content {
          padding: 1.5rem;
        }

        .menu-item {
          grid-template-columns: 1fr;
          gap: 0.5rem;
        }

        .menu-item-price {
          margin-top: 0.5rem;
        }

        .nav-actions {
          margin-left: auto;
